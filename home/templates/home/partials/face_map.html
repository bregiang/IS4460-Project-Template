{% load static %}
<div class="skin-map-visual js-skin-map" data-profile="combination">
    <div class="face-map-canvas">
        <div class="map-toolbar" aria-label="Skin map display">
            <span class="map-status"><span class="status-dot" aria-hidden="true"></span> Live facial map</span>
            <span class="map-hint">Select a zone to explore</span>
        </div>
        <svg viewBox="0 0 520 700" role="group" aria-label="Interactive facial skin analysis map">
            <defs>
                <clipPath id="portraitClip"><rect x="26" y="0" width="468" height="700" rx="32"/></clipPath>
            </defs>
            <title>Example facial skin analysis map — interactive and personalized</title>
            <desc>A realistic front-facing consultation portrait. Choose the forehead, nose, chin, cheeks, under eyes, jawline, or T-zone for concern details and ingredient guidance.</desc>
            <image class="consultation-portrait" href="{% static 'home/images/consultation-face-v2.png' %}" x="26" y="0" width="468" height="700" preserveAspectRatio="xMidYMid meet" clip-path="url(#portraitClip)"/>
            <rect class="portrait-frame" x="26" y="0" width="468" height="700" rx="32" fill="none"/>

            <g class="interactive-zones" fill="#fff" fill-opacity=".15" stroke="#fff" stroke-opacity=".75" stroke-width="1.5">
                <path class="map-zone zone-forehead" data-region="forehead" role="button" tabindex="0" aria-label="Forehead: oiliness and texture" d="M180 160Q260 127 340 160L333 216Q260 200 187 216Z"/>
                <path class="map-zone zone-tzone" data-region="tzone" role="button" tabindex="0" aria-label="T-zone: oil and visible pores" d="M206 178Q260 154 314 178L310 203Q286 198 279 220L287 399Q260 417 233 399L241 220Q234 198 210 203Z"/>
                <path class="map-zone zone-cheek" data-region="leftCheek" role="button" tabindex="0" aria-label="Left cheek: redness and sensitivity" d="M119 339Q165 310 215 334Q218 378 190 405Q142 411 119 374Z"/>
                <path class="map-zone zone-cheek" data-region="rightCheek" role="button" tabindex="0" aria-label="Right cheek: redness and sensitivity" d="M401 339Q355 310 305 334Q302 378 330 405Q378 411 401 374Z"/>
                <path class="map-zone zone-eyes" data-region="underLeftEye" role="button" tabindex="0" aria-label="Under left eye: hydration and fine lines" d="M132 303Q182 281 232 300Q196 327 145 316Q136 313 132 303Z"/>
                <path class="map-zone zone-eyes" data-region="underRightEye" role="button" tabindex="0" aria-label="Under right eye: hydration and fine lines" d="M388 303Q338 281 288 300Q324 327 375 316Q384 313 388 303Z"/>
                <path class="map-zone zone-nose" data-region="nose" role="button" tabindex="0" aria-label="Nose: pores and oiliness" d="M239 317Q235 378 228 416Q260 432 292 416Q285 378 281 317Z"/>
                <path class="map-zone zone-chin" data-region="chin" role="button" tabindex="0" aria-label="Chin: acne and congestion" d="M211 468Q260 449 309 468L298 519Q260 540 222 519Z"/>
                <path class="map-zone zone-jawline" data-region="jawline" role="button" tabindex="0" aria-label="Jawline: sensitivity and hormonal breakouts" d="M111 403Q135 548 260 564Q385 548 409 403L391 407Q361 524 260 547Q159 524 129 407Z"/>
            </g>
        </svg>
        <div class="zone-selector">
            <p class="zone-selector-label">Explore by area</p>
            <div class="zone-pills" role="group" aria-label="Facial regions">
                <button class="zone-pill" type="button" data-region="forehead">Forehead</button>
                <button class="zone-pill" type="button" data-region="nose">Nose</button>
                <button class="zone-pill" type="button" data-region="leftCheek">Left cheek</button>
                <button class="zone-pill" type="button" data-region="rightCheek">Right cheek</button>
                <button class="zone-pill" type="button" data-region="underLeftEye">Left under eye</button>
                <button class="zone-pill" type="button" data-region="underRightEye">Right under eye</button>
                <button class="zone-pill" type="button" data-region="chin">Chin</button>
                <button class="zone-pill" type="button" data-region="jawline">Jawline</button>
                <button class="zone-pill" type="button" data-region="tzone">T-zone</button>
            </div>
        </div>
    </div>

    <aside class="zone-insight-card" aria-live="polite">
        <div class="insight-topline">
            <span class="concern-icon" aria-hidden="true"></span>
            <span class="zone-severity"></span>
        </div>
        <p class="insight-kicker">Selected region</p>
        <h3 class="zone-title">T-zone</h3>
        <p class="zone-summary">This central area commonly produces more oil than the cheeks.</p>
        <div class="metric-stack" aria-label="Region metrics"></div>
        <div class="insight-detail">
            <span>Why it happens</span>
            <p class="zone-why"></p>
        </div>
        <div class="ingredient-recommendation">
            <span>Ingredient pairing</span>
            <strong class="zone-ingredient"></strong>
            <small class="zone-product"></small>
        </div>
        <p class="map-disclaimer">Educational guidance, not a medical diagnosis.</p>
    </aside>
</div>

<script>
(() => {
    const map = document.currentScript.previousElementSibling;
    const regions = {
        forehead: { title: "Forehead", icon: "oil", severity: "Moderate", summary: "Shine and uneven texture can build here as sebum mixes with sunscreen and makeup.", why: "The forehead has a high concentration of sebaceous glands and is affected by hair products and occlusion.", ingredient: "2% niacinamide", product: "Pair with a lightweight balancing serum.", metrics: [["Oiliness", 76], ["Texture", 44], ["Hydration", 58]] },
        tzone: { title: "T-zone", icon: "oil", severity: "Priority zone", summary: "The forehead, nose, and chin often behave differently from the cheeks.", why: "Sebaceous glands are more concentrated through the center of the face.", ingredient: "Niacinamide + zinc PCA", product: "Try a non-stripping gel cleanser and fluid moisturizer.", metrics: [["Oiliness", 82], ["Pores", 68], ["Hydration", 51]] },
        nose: { title: "Nose", icon: "pores", severity: "Visible pores", summary: "Pores are more visible where oil and cellular debris collect.", why: "Pores can appear larger with higher sebum output; they cannot be permanently opened or closed.", ingredient: "Salicylic acid", product: "Use a gentle BHA treatment 1–2 evenings weekly.", metrics: [["Pores", 72], ["Oiliness", 69], ["Texture", 48]] },
        leftCheek: { title: "Left cheek", icon: "redness", severity: "Calm gently", summary: "Diffuse redness and dehydration can make this area feel reactive.", why: "Cheeks have fewer oil glands and may be more exposed to friction, weather, and barrier disruption.", ingredient: "Centella + panthenol", product: "Choose a fragrance-free barrier cream.", metrics: [["Redness", 63], ["Sensitivity", 71], ["Hydration", 46]] },
        rightCheek: { title: "Right cheek", icon: "redness", severity: "Calm gently", summary: "Diffuse redness and dehydration can make this area feel reactive.", why: "Cheeks have fewer oil glands and may be more exposed to friction, weather, and barrier disruption.", ingredient: "Centella + panthenol", product: "Choose a fragrance-free barrier cream.", metrics: [["Redness", 58], ["Sensitivity", 66], ["Hydration", 49]] },
        underLeftEye: { title: "Left under eye", icon: "hydration", severity: "Delicate area", summary: "Fine lines can appear more visible when this thin skin is dehydrated.", why: "Under-eye skin is thinner and has fewer sebaceous glands than most facial zones.", ingredient: "Hyaluronic acid + peptides", product: "Pat in a fragrance-free hydrating eye gel.", metrics: [["Hydration", 42], ["Fine lines", 54], ["Sensitivity", 62]] },
        underRightEye: { title: "Right under eye", icon: "hydration", severity: "Delicate area", summary: "Fine lines can appear more visible when this thin skin is dehydrated.", why: "Under-eye skin is thinner and has fewer sebaceous glands than most facial zones.", ingredient: "Hyaluronic acid + peptides", product: "Pat in a fragrance-free hydrating eye gel.", metrics: [["Hydration", 44], ["Fine lines", 51], ["Sensitivity", 60]] },
        chin: { title: "Chin", icon: "acne", severity: "Monitor", summary: "Small blemishes and congestion often cluster around the chin.", why: "Hormonal fluctuation, occlusion, and touching can contribute to congestion here.", ingredient: "Azelaic acid", product: "Apply a gentle targeted treatment, then moisturize.", metrics: [["Acne", 61], ["Redness", 43], ["Texture", 57]] },
        jawline: { title: "Jawline", icon: "sensitive", severity: "Low–moderate", summary: "This area can show friction sensitivity or recurring blemishes.", why: "Hormonal changes and contact from phones, collars, or hands may affect the jawline.", ingredient: "Azelaic acid + ceramides", product: "Support with a non-comedogenic barrier lotion.", metrics: [["Sensitivity", 52], ["Acne", 47], ["Texture", 39]] }
    };
    const profileOverrides = {
        dry: { region: "underLeftEye", label: "Dry-skin focus", zones: ["zone-eyes", "zone-cheek"] },
        oily: { region: "tzone", label: "Oil-control focus", zones: ["zone-tzone", "zone-forehead", "zone-nose"] },
        combination: { region: "tzone", label: "Combination focus", zones: ["zone-tzone", "zone-cheek"] },
        sensitive: { region: "leftCheek", label: "Sensitivity focus", zones: ["zone-cheek", "zone-jawline"] },
        normal: { region: "forehead", label: "Balanced profile", zones: ["zone-forehead"] }
    };

    function selectRegion(name, focusControl = false) {
        const data = regions[name] || regions.tzone;
        map.dataset.activeRegion = name;
        map.querySelectorAll("[data-region]").forEach(el => {
            const selected = el.dataset.region === name;
            el.classList.toggle("is-selected", selected);
            if (el.matches("button, [role='button']")) el.setAttribute("aria-pressed", String(selected));
        });
        map.querySelector(".zone-title").textContent = data.title;
        map.querySelector(".zone-summary").textContent = data.summary;
        map.querySelector(".zone-why").textContent = data.why;
        map.querySelector(".zone-ingredient").textContent = data.ingredient;
        map.querySelector(".zone-product").textContent = data.product;
        map.querySelector(".zone-severity").textContent = data.severity;
        map.querySelector(".concern-icon").className = `concern-icon icon-${data.icon}`;
        map.querySelector(".metric-stack").innerHTML = data.metrics.map(([label, value]) =>
            `<div class="map-metric"><div><span>${label}</span><strong>${value}%</strong></div><span class="metric-track"><i style="width:${value}%"></i></span></div>`
        ).join("");
        if (focusControl) map.querySelector(".zone-insight-card").scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    map.addEventListener("click", event => {
        const control = event.target.closest("[data-region]");
        if (control) selectRegion(control.dataset.region, control.tagName === "BUTTON");
    });
    map.addEventListener("keydown", event => {
        const control = event.target.closest("[data-region]");
        if (control && (event.key === "Enter" || event.key === " ")) {
            event.preventDefault();
            selectRegion(control.dataset.region, true);
        }
    });
    map.addEventListener("mouseover", event => {
        const zone = event.target.closest(".map-zone[data-region]");
        if (zone) selectRegion(zone.dataset.region);
    });
    window.addEventListener("skinprofilechange", event => {
        const type = event.detail?.type || "combination";
        const config = profileOverrides[type] || profileOverrides.combination;
        map.dataset.profile = type;
        map.querySelector(".map-hint").textContent = config.label;
        map.querySelectorAll(".map-zone").forEach(zone => zone.classList.toggle("is-profiled", config.zones.some(token => zone.classList.contains(token))));
        selectRegion(config.region);
    });
    selectRegion("tzone");
})();
</script>
