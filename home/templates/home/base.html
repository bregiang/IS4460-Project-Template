<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SkinIdentifier{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8f6ff 0%, #eef6ff 100%);
            color: #1f2937;
        }

        h1, h2, h3, h4, .brand-title {
            font-family: 'Playfair Display', serif;
        }

        .brand-title {
            color: #5b4bff;
            font-weight: 700;
        }

        .hero-card {
            background: linear-gradient(135deg, #ffffff 0%, #f3f0ff 100%);
            border: 0;
            border-radius: 1.5rem;
            box-shadow: 0 12px 35px rgba(91, 75, 255, 0.12);
        }

        .feature-icon {
            width: 48px;
            height: 48px;
            background: #ede9ff;
            color: #5b4bff;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand brand-title fs-3" href="{% url 'home' %}">SkinIdentifier</a>
            <div class="ms-auto">
                {% if user.is_authenticated %}
                    <a class="btn btn-outline-primary me-2" href="{% url 'dashboard' %}">Dashboard</a>
                    <a class="btn btn-primary" href="{% url 'logout' %}">Logout</a>
                {% else %}
                    <a class="btn btn-outline-primary me-2" href="{% url 'login' %}">Login</a>
                    <a class="btn btn-primary" href="{% url 'register' %}">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}" role="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
