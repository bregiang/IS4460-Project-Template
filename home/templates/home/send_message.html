{% extends 'home/base.html' %}

{% block title %}Send Message | SkinIdentifier{% endblock %}

{% block content %}
<div class="card hero-card p-4 p-md-5">
  <h1 class="display-6 mb-3">Send a message</h1>
  <p class="lead text-secondary">Share routines, professional advice, or follow-up notes with a patient securely inside the platform.</p>
</div>

<div class="card p-4 mt-4">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-terra" type="submit">Send message</button>
  </form>
</div>
{% endblock %}
